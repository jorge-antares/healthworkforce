name: opt

services:
  app:
    build: ./app
    container_name: appcont
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - net


  ngx:
    image: nginx:1.31.7-alpine-slim
    container_name: ngxcont
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/log:/var/log/nginx
      - ./nginx/ssl:/etc/ssl:ro
    networks:
      - net
    depends_on:
      app:
        condition: service_healthy


networks:
  net:
    driver: bridge
