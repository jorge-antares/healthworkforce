name: opt

services:
  app:
    build: .
    container_name: appcont
    stop_signal: SIGINT
    expose:
      - "5000"
    user: "1010:1010"
    restart: unless-stopped
    networks:
      - net


  ngx:
    image: nginx:1.31.7-alpine-slim
    container_name: ngxcont
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/log:/var/log/nginx
      - ./nginx/ssl:/etc/nginx/certs:ro
    networks:
      - net
    depends_on:
      app:
        condition: service_healthy


networks:
  net:
    driver: bridge
