# RATE LIMITING ZONES
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;


# PROXY BACKEND
upstream myapp {
    server app:5000 max_fails=3 fail_timeout=30s;
    #keepalive 32;
    #keepalive_requests 100;
    #keepalive_timeout 65s;
}

# HTTP Server
server {
    listen 80 default_server;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}


# HTTPS Server
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    # SSL Configuration
    ssl_certificate /etc/ssl/fullchain.pem;
    ssl_certificate_key /etc/ssl/privkey.pem;
    
    # SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/ssl/chain.pem;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    #add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;
    
    # Hide Nginx version
    server_tokens off;
    #more_clear_headers Server;

    # Logging
    access_log /var/log/nginx/access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # Request size limits
    client_max_body_size 128k;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Timeouts
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 10s;

    # Block common exploit attempts (but allow .well-known)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Block access to sensitive files
    location ~* \.(env|git|sql|bak|swp|log|ini|conf|yml|yaml)$ {
        deny all;
        return 404;
    }

    # Block path traversal attempts
    location ~ \.\. {
        deny all;
        return 404;
    }

    # Block paths that end in .php, .asp, .aspx, .jsp
    location ~* \.(php|asp|aspx|jsp|cgi|pl)$ {
        deny all;
        return 404;
    }

    # Disable access to CGI scripts
    location ~* /cgi-bin/ {
        deny all;
        return 404;
    }

    # Block suspicious paths
    location ~* /(admin|login|config|setup|php|wordpress|wp|env|staging|geoserver|settings|phpmyadmin|xmlrpc|backup) {
        deny all;
        return 404;
    }

    # Block user agents
    if ($http_user_agent ~* (bot|crawler|spider|scraper|curl|wget|python|java|nikto|sqlmap|nmap)) {
        return 403;
    }

    # Block suspicious referrers
    if ($http_referer ~* (porn|viagra|cialis|casino|poker)) {
        return 403;
    }

    # Rate limiting
    limit_req zone=general burst=20 nodelay;
    limit_conn addr 10;

    # Root location
    location / {
        proxy_pass http://myapp;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        proxy_set_header Connection "";
        
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        proxy_request_buffering off;
        
        # Prevent proxy header injection
        proxy_pass_request_headers on;
        proxy_hide_header X-Powered-By;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        expires 7d;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\nDisallow: /solve\n";
    }
}

